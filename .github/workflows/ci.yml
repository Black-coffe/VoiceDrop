name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff

      # Bug-catching subset (GitHub's own "must-not-fail" preset):
      # E9   syntax errors
      # F63  comparison/logic mistakes (`is` with literals, `not in` typos)
      # F7   misplaced break/continue/return, default-arg syntax
      # F82  undefined names (catches stale imports after refactors —
      #      e.g. `from x import Removed` left behind by a partial revert)
      - name: Lint (bug-only ruleset)
        run: ruff check --select E9,F63,F7,F82 --exclude .venv --exclude build --exclude dist .

      # Belt-and-braces: actually byte-compile every .py to catch anything
      # ruff missed (encoding issues, weird syntax extensions).
      - name: Byte-compile all sources
        run: python -m compileall -q -x "(\.venv|build|dist)" .
